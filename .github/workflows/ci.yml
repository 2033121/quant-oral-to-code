name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/quant-oral-to-code/requirements.txt

      - name: Layout tests
        working-directory: skills/quant-oral-to-code/scripts
        run: |
          python test_skill_layout.py
          python test_guardrails.py
          python test_build_release_bundle.py

      - name: Full pipeline validation
        working-directory: skills/quant-oral-to-code/scripts
        run: python run_full_validation.py
